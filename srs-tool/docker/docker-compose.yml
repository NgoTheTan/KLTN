version: "3.9"

services:
  # API Server
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://srs:srs@postgres:5432/srsdb
      - REDIS_URL=redis://redis:6379
      - PLANTUML_URL=http://plantuml:8080
      - UPLOAD_DIR=/data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - public
      - internal

  # Worker
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://srs:srs@postgres:5432/srsdb
      - REDIS_URL=redis://redis:6379
      - PLANTUML_URL=http://plantuml:8080
      - WORKER_CONCURRENCY=4
      - UPLOAD_DIR=/data/uploads
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: srs
      POSTGRES_PASSWORD: srs
      POSTGRES_DB: srsdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srs -d srsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - public
      - internal

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - public
      - internal

  # PlantUML Server (sandboxed — no egress network)
  plantuml:
    image: plantuml/plantuml-server:jetty
    environment:
      - PLANTUML_LIMIT_SIZE=8192
    # No ports exposed to host — only reachable from api/worker via internal network
    networks:
      - internal
    # Security: no external network access
    # In production: add --network-internal and block egress at container level

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  public:
  internal:
    internal: true  # PlantUML + Redis cannot reach the internet
